# 会议改期联调控制台：Master 使用本机 llama.cpp 的 27B 聊天端点，审计链与正式控制台共用目录。
listenHost=127.0.0.1
listenPort=18900
auditDirectory=java/console-audit

chatWorkerConfig=classpath:/config/chat-worker-gemini.properties
chatWorkerRolePrompt=classpath:/config/chat-worker-misty-prompt.txt

routerConfig=java/src/test/resources/evaluation/router-qwen35.properties
routerRolePrompt=classpath:/config/router-role-prompt.txt
routerMetrics=http://127.0.0.1:18082/metrics
routerMetricsFormat=VLLM

masterConfig=java/src/test/resources/evaluation/master-qwen38.properties
masterMetrics=http://127.0.0.1:18081/metrics
masterMetricsFormat=LLAMA_CPP
masterMaxTokens=256
masterTemperature=0

gpuMetrics=NVIDIA_SMI
metricsIntervalSeconds=10
metricsTimeoutSeconds=5
