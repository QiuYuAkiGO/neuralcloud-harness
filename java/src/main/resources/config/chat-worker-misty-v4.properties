# 远端控制台通过 SSH 回环转发访问模型机，密钥与本机推理服务的 api-key-file 对应。
apiFormat=OPENAI_CHAT
endpoint=http://127.0.0.1:18083/v1/chat/completions
model=qwen3.5-9b-mistyv4
apiKeyEnv=MISTY_CHAT_API_KEY
httpVersion=HTTP_1_1
enableThinking=false
thinkingFormat=CHAT_TEMPLATE_KWARGS
connectTimeoutSeconds=10
requestTimeoutSeconds=240
maxOutputTokens=1024
replyPreferences=classpath:/config/chat-worker-misty-reply-preferences.txt
