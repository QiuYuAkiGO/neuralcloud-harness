# 网页控制台只监听本机回环地址。审计路径相对于启动 Java 时的工作目录。
listenHost=127.0.0.1
listenPort=18900
auditDirectory=java/console-audit

chatWorkerConfig=classpath:/config/chat-worker-gemini.properties
chatWorkerRolePrompt=classpath:/config/chat-worker-misty-prompt.txt

# 前台对话的轮内复核。按需逐项打开，重启控制台后生效。
chatReviewRecallSources=false
chatReviewBeforePlan=false
chatReviewAfterPlan=false
chatReviewBeforeDraft=false
chatReviewAfterDraft=false
chatReviewBeforeReturn=false
chatReviewDeliverySources=false
chatReviewQqMembership=false

routerConfig=classpath:/config/router.properties
routerRolePrompt=classpath:/config/router-role-prompt.txt

masterConfig=classpath:/config/master-deepseek.properties
masterMaxTokens=1024
masterTemperature=0

# NVIDIA_SMI 通过本机 nvidia-smi 读取显存与利用率，NONE 不读取。
gpuMetrics=NONE
metricsIntervalSeconds=10
metricsTimeoutSeconds=5
