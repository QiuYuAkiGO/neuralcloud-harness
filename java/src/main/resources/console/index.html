<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuralCloud 控制台</title>
  <script>
    // 在样式加载前确定主题，避免暗色模式下先闪一下亮色。未手动选择时跟随系统。
    document.documentElement.dataset.theme = localStorage.getItem('neuralcloud.theme')
      ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- 顶部导航栏：应用标题、三大功能页签切换（对话 / 审计链 / 节点状态）以及亮暗主题切换按钮 -->
<header>
  <h1>NeuralCloud 控制台</h1>
  <nav>
    <button class="tab active" data-tab="chat">对话</button>
    <button class="tab" data-tab="audit">审计链</button>
    <button class="tab" data-tab="qq">QQ 渠道</button>
    <button class="tab" data-tab="nodes">节点状态</button>
  </nav>
  <button id="theme-toggle"></button>
</header>

<main>
  <!-- 对话页签：选择目标节点并围绕当前会话 chain 发送正文，消息列表始终从服务端审计链回放 -->
  <section id="tab-chat" class="panel active">
    <div class="toolbar">
      <label>节点 <select id="chat-node"></select></label>
      <span class="muted">会话 <code id="chat-chain"></code></span>
      <button id="chat-new">新会话</button>
    </div>
    <div id="chat-log" class="chat-log"></div>
    <form id="chat-form" class="chat-form">
      <textarea id="chat-text" rows="3" placeholder="输入要交给节点的正文，Ctrl+Enter 发送"></textarea>
      <button type="submit" id="chat-send" disabled>发送</button>
    </form>
    <p id="chat-error" class="error"></p>
  </section>

  <!-- 审计链页签：左侧按最近活跃顺序列出全部会话/探测链，右侧以因果树渲染该链完整原始事件 -->
  <section id="tab-audit" class="panel">
    <div class="audit">
      <aside>
        <div class="toolbar"><strong>审计链</strong><button id="audit-refresh">刷新</button></div>
        <ul id="audit-chains" class="chain-list"></ul>
      </aside>
      <div id="audit-events" class="audit-events"><p class="muted">选择左侧的一条审计链。</p></div>
    </div>
  </section>

  <!-- QQ 群名单和接收策略由已认证的渠道连接提供，计数与审计链使用相同的持久事件。 -->
  <section id="tab-qq" class="panel">
    <div class="toolbar"><strong>QQ 群聊</strong><span id="qq-status" class="muted" role="status"></span><button id="qq-refresh">刷新</button></div>
    <p id="qq-error" class="error" role="alert"></p>
    <div id="qq-rooms" class="cards"></div>
  </section>

  <!-- 节点状态页签：展示各模型节点健康状态、最近调用/探测结果、Prometheus 指标及本机 GPU 表格 -->
  <section id="tab-nodes" class="panel">
    <div class="toolbar"><strong>节点</strong><span id="nodes-updated" class="muted"></span><button id="nodes-refresh">刷新</button></div>
    <div id="node-cards" class="cards"></div>
    <h2>GPU</h2>
    <div id="gpu"></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
