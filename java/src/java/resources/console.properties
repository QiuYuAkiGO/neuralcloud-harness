# 网页控制台只监听本机回环地址。路径相对于启动 Java 时的工作目录（仓库根目录）。
listenHost=127.0.0.1
listenPort=18900
auditDirectory=java/console-audit

chatWorkerConfig=java/src/java/resources/chat-worker-gemini.properties
chatWorkerRolePrompt=java/src/java/resources/chat-worker-role-prompt.txt

routerConfig=java/src/java/resources/router.properties
routerRolePrompt=java/src/java/resources/router-role-prompt.txt
routerMetrics=http://127.0.0.1:18082/metrics
routerMetricsFormat=VLLM

masterConfig=java/src/java/resources/master.properties
masterMetrics=http://127.0.0.1:8000/metrics
masterMetricsFormat=VLLM
masterMaxTokens=256
masterTemperature=0

# NVIDIA_SMI 通过本机 nvidia-smi 读取显存与利用率，NONE 不读取。
gpuMetrics=NVIDIA_SMI
metricsIntervalSeconds=10
metricsTimeoutSeconds=5
